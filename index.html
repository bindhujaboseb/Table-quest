<style>
/* Layout: sticky score bar → one stage card at a time (login → starter → main → plenary → results).
   One bright classroom look for projectors, so every colour is set explicitly. */
:root {
  color-scheme: light;
  --bg: #F1F6F5; --paper: #FFFFFF; --ink: #102229; --muted: #55676C; --line: #D5E1DE;
  --night: #0C3A45; --dusk: #12596A; --sand: #F4DFB4; --sun: #F5A623;
  --t1: #138A9E; --t1-soft: #DDF2F5;
  --t2: #E2574C; --t2-soft: #FCE4E1;
  --t3: #D98A0B; --t3-soft: #FCEFD6;
  --t4: #1E9A5F; --t4-soft: #DBF3E6;
  --code-bg: #10212A; --code-fg: #DCE8E5; --code-dim: #6E8790; --code-new: #FFC857;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", Consolas, "Courier New", monospace;
  --tc: var(--t1); --tc-soft: var(--t1-soft);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; min-height: 100vh; }
code, kbd { font-family: var(--font-code); font-size: .88em; background: var(--tc-soft); color: var(--ink); padding: 1px 6px; border-radius: 5px; }
kbd { background: #FFF4DA; border: 1px solid var(--t3); border-bottom-width: 3px; font-weight: 600; }
button { font: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > * { min-width: 0; }

/* ---------- score bar ---------- */
.bar { position: sticky; top: 0; z-index: 10; background: var(--night); color: #FFFFFF; box-shadow: 0 4px 16px rgba(12,58,69,.25); }
.bar-in { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 8px; }
.logo span { font-family: var(--font-code); font-size: 13px; background: var(--sun); color: var(--night); padding: 2px 8px; border-radius: 6px; }
.who { color: #CFE6E6; font-size: 14px; }
.who b { color: #FFFFFF; }
.stages { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.stages span { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); color: #9FC3C6; }
.stages span.on { background: var(--sun); color: var(--night); }
.stages span.done { background: rgba(255,255,255,.22); color: #FFFFFF; }
.stages span.done::before { content: "✓ "; }
.points { position: relative; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 14px 4px 6px; }
.points .coin { width: 28px; height: 28px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; color: var(--night); font-weight: 800; }
.points b { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; min-width: 2.5ch; }
.points small { color: #9FC3C6; }
.fly { position: absolute; right: 8px; top: -4px; font-weight: 800; color: var(--sun); pointer-events: none; font-family: var(--font-display); font-size: 20px; }

/* ---------- shared ---------- */
.stage-head { display: flex; align-items: center; gap: 16px; background: var(--tc); color: #FFFFFF; border-radius: 22px; padding: 18px 22px; position: relative; overflow: hidden; }
.stage-head::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; border: 26px solid rgba(255,255,255,.14); }
.stage-head .big { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: .8; }
.stage-head .lbl { font-family: var(--font-code); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.stage-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3vw, 30px); margin: 2px 0 0; line-height: 1.1; text-wrap: balance; }
.stage-head p { margin: 4px 0 0; opacity: .92; max-width: 60ch; }
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 20px 22px; min-width: 0; }
.card h3 { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.btn { font-weight: 700; font-size: 16px; border-radius: 14px; padding: 12px 22px; cursor: pointer; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
.btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn.primary { background: var(--tc); border-color: var(--tc); color: #FFFFFF; box-shadow: 0 4px 0 rgba(16,34,41,.25); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(16,34,41,.25); }
.btn.ghost { border-color: var(--line); color: var(--muted); font-weight: 400; font-size: 15px; }
.btn:disabled { background: var(--line); border-color: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.note { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.msg { border-radius: 14px; padding: 10px 14px; font-weight: 700; margin-top: 12px; }
.msg.good { background: var(--t4-soft); color: #11603A; border: 2px solid var(--t4); }
.msg.bad { background: var(--t2-soft); color: #9A2C23; border: 2px solid var(--t2); }
.msg.info { background: var(--t3-soft); color: #7A4E05; border: 2px solid var(--t3); }

/* ---------- login ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; background: linear-gradient(180deg, var(--night) 0%, var(--dusk) 70%, #2C7C82 100%); color: #FFFFFF; padding: 32px 32px 150px; }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 8vw, 76px); line-height: .95; margin: 6px 0 10px; }
.hero h1 span { font-family: var(--font-code); font-size: .38em; font-weight: 600; background: var(--sun); color: var(--night); padding: 4px 10px; border-radius: 8px; vertical-align: middle; position: relative; top: -.2em; }
.eyebrow { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--sand); }
.hero p { color: #CFE6E6; font-size: 18px; max-width: 48ch; margin: 0; }
.skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 150px; }
.login { position: relative; z-index: 2; margin-top: -110px; margin-inline: auto; width: min(560px, 100%); background: var(--paper); border-radius: 22px; padding: 24px; box-shadow: 0 12px 30px rgba(12,58,69,.2); display: grid; gap: 14px; }
.login h2 { font-family: var(--font-display); font-weight: 800; margin: 0; font-size: 24px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; }
.field input, .field select { font: inherit; font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); width: 100%; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field select { appearance: auto; cursor: pointer; }
.map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.map div { border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.map b { display: block; font-family: var(--font-display); font-size: 16px; }
@media (max-width: 520px) { .map { grid-template-columns: minmax(0, 1fr); } .hero { padding: 24px 20px 130px; } }

/* ---------- starter: animated table ---------- */
.demo-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 880px) { .demo-stage { grid-template-columns: minmax(0, 1fr); } }
.frame { position: relative; padding: 18px 18px 18px 64px; border-radius: 16px; border: 3px dashed transparent; transition: border-color .4s, background .4s; cursor: default; }
.frame.show { border-color: var(--t1); background: var(--t1-soft); }
.frame.target { cursor: pointer; }
table.demo { border-collapse: collapse; width: 100%; font-size: 16px; background: #FFFFFF; }
table.demo caption { font-weight: 700; padding: 6px; border-radius: 8px; transition: opacity .4s, transform .4s, background .4s; }
table.demo th, table.demo td { border: 2px solid #33464D; padding: 10px 12px; text-align: left; transition: opacity .4s, transform .4s, background .4s, box-shadow .3s; }
table.demo th { text-align: center; }
table.demo tr { position: relative; }
.hide { opacity: 0; transform: translateY(8px); }
.glow-cap { background: var(--t3-soft); }
.glow-th { background: var(--t2-soft) !important; }
.glow-td { background: var(--t4-soft) !important; }
.rowtab { position: absolute; left: 6px; width: 50px; border-radius: 10px; border: 2px solid var(--t3); background: var(--t3-soft); color: #7A4E05; font-family: var(--font-code); font-size: 12px; font-weight: 600; display: grid; place-items: center; transition: opacity .4s, transform .4s; cursor: default; padding: 0; }
.rowtab.target { cursor: pointer; }
.tag-chip { position: absolute; font-family: var(--font-code); font-size: 13px; font-weight: 600; color: #FFFFFF; padding: 3px 9px; border-radius: 8px; white-space: nowrap; transition: opacity .4s, transform .4s; pointer-events: none; }
.legend { display: grid; gap: 8px; }
.legend div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); transition: background .3s, border-color .3s, opacity .3s; opacity: .45; }
.legend div.lit { opacity: 1; border-color: var(--c); background: var(--cs); }
.legend code { background: var(--c); color: #FFFFFF; text-align: center; padding: 4px 6px; font-size: 14px; }
.legend span { font-size: 15px; }
.codebox { background: var(--code-bg); color: var(--code-fg); border-radius: 14px; overflow: hidden; }
.codebox .cbar { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; padding: 7px 14px; font-family: var(--font-code); font-size: 12px; color: var(--code-dim); border-bottom: 1px solid rgba(255,255,255,.08); }
.codebox .cbar i { font-style: normal; color: var(--code-new); }
.codebox pre { margin: 0; padding: 12px 16px; font-family: var(--font-code); font-size: 14px; line-height: 1.65; overflow-x: auto; }
.codebox .ln { display: block; color: var(--code-dim); transition: color .3s, background .3s; border-radius: 4px; }
.codebox .ln.lit { color: var(--code-new); background: rgba(255,200,87,.1); }
.codebox .new { color: var(--code-new); font-weight: 600; }
.codebox .old { color: var(--code-dim); }

/* warm-up blanks */
.sentence { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4vw, 38px); line-height: 1.5; margin: 6px 0 18px; }
.blank { font: inherit; color: var(--muted); background: var(--t1-soft); border: 3px dashed var(--t1); border-radius: 14px; padding: 0 16px; min-width: 5.2em; cursor: pointer; vertical-align: baseline; }
.blank.filled { color: var(--ink); border-style: solid; background: var(--paper); }
.blank.right { border-color: var(--t4); background: var(--t4-soft); color: #11603A; cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-weight: 700; font-size: 18px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.chip:hover:not(:disabled) { background: var(--t3-soft); }
.chip:disabled { opacity: .3; cursor: default; box-shadow: none; }
.grid-demo { margin-top: 18px; }
.gd-wrap { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
.gd { display: grid; grid-template-columns: repeat(4, 56px); grid-template-rows: repeat(3, 40px); border: 2px solid var(--ink); }
.gd span { border: 1px solid #33464D; background: var(--paper); }
.gd span.r { background: var(--t3-soft); }
.gd span.c { background: var(--t1-soft); }
.gd span.r.c { background: var(--t4); }
.gd-keys { display: grid; gap: 6px; font-weight: 700; }
.gd-keys .kr { color: #7A4E05; } .gd-keys .kc { color: var(--t1); } .gd-keys .kx { color: var(--t4); }
@media (prefers-reduced-motion: no-preference) {
  .gd span { animation: cellIn .4s backwards; }
  .gd span:nth-child(n+5) { animation-delay: .15s; } .gd span:nth-child(n+9) { animation-delay: .3s; }
  @keyframes cellIn { from { opacity: 0; transform: scale(.6); } }
}

/* hunt */
.challenge { display: flex; align-items: center; gap: 14px; background: var(--night); color: #FFFFFF; border-radius: 16px; padding: 14px 18px; }
.challenge .q { font-family: var(--font-display); font-weight: 800; font-size: clamp(18px, 2.4vw, 24px); line-height: 1.2; }
.challenge .q code { background: var(--sun); color: var(--night); }
.challenge .n { flex: none; font-family: var(--font-code); font-size: 13px; background: rgba(255,255,255,.15); padding: 4px 10px; border-radius: 999px; }
.hunt-target { cursor: pointer; }
.hunt-target:hover { box-shadow: inset 0 0 0 3px var(--sun); }
.flash-good { animation: fg .7s; }
.flash-bad { animation: fb .5s; }
@keyframes fg { 0%, 100% { background: inherit; } 40% { background: var(--t4-soft); box-shadow: inset 0 0 0 4px var(--t4); } }
@keyframes fb { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ---------- main tasks ---------- */
.routine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.routine div { background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; min-width: 0; }
.routine .n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: #FFFFFF; }
.routine b { display: block; font-size: 15px; }
.routine .s { font-size: 13.5px; color: var(--muted); }
@media (max-width: 760px) { .routine { grid-template-columns: minmax(0, 1fr); } }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.levels div { border-radius: 14px; border: 2px solid var(--line); background: var(--paper); padding: 8px 10px; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; min-width: 0; }
.levels .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; font-family: var(--font-display); background: var(--line); }
.levels div.cur { border-color: var(--c); box-shadow: 0 0 0 3px var(--cs); }
.levels div.cur .dot, .levels div.ok .dot { background: var(--c); }
.levels div.ok { background: var(--cs); border-color: var(--c); }
.levels div.lock { opacity: .5; }
@media (max-width: 640px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.task-body p { margin: 0; max-width: 62ch; }
.task-body ul { margin: 8px 0 0; padding-left: 20px; }
details.hint { margin-top: 14px; border-radius: 14px; background: var(--tc-soft); padding: 10px 14px; }
details.hint summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; gap: 8px; align-items: center; }
details.hint summary::-webkit-details-marker { display: none; }
details.hint summary::before { content: "+"; width: 22px; height: 22px; border-radius: 50%; background: var(--tc); color: #FFFFFF; display: grid; place-items: center; font-weight: 800; flex: none; }
details.hint[open] summary::before { content: "–"; }
details.hint .codebox { margin-top: 10px; }
.checklist { display: grid; gap: 8px; }
.checklist label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); }
.checklist input { appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2.5px solid var(--tc); background: var(--paper); display: grid; place-items: center; margin: 0; cursor: pointer; }
.checklist input::after { content: ""; width: 7px; height: 13px; border: solid #FFFFFF; border-width: 0 3px 3px 0; transform: rotate(45deg) scale(0); margin-top: -3px; transition: transform .15s; }
.checklist input:checked { background: var(--tc); }
.checklist input:checked::after { transform: rotate(45deg) scale(1); }
.checklist label:has(input:checked) { background: var(--tc-soft); border-color: var(--tc); }
.mcq { display: grid; gap: 8px; }
.mcq button { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-size: 16px; color: var(--ink); display: flex; gap: 12px; align-items: center; }
.mcq button:hover:not(:disabled) { border-color: var(--tc); background: var(--tc-soft); }
.mcq button .k { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--tc-soft); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.mcq button.right { border-color: var(--t4); background: var(--t4-soft); }
.mcq button.wrong { border-color: var(--t2); background: var(--t2-soft); }
.mcq button:disabled { cursor: default; }
.device { background: var(--night); border-radius: 22px; padding: 10px; }
.device .label { color: #FFFFFF; padding: 6px 8px 10px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.device .label .pill { font-family: var(--font-code); font-size: 12px; background: var(--sun); color: var(--night); padding: 2px 8px; border-radius: 6px; }
.screen { border-radius: 14px; overflow: hidden; background: #FFFFFF; }
.chrome { background: #E4ECEA; padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #EE6A5F; } .dots i:nth-child(2) { background: #F5BE4F; } .dots i:nth-child(3) { background: #62C554; }
.url { flex: 1; min-width: 0; background: #FFFFFF; border-radius: 999px; padding: 4px 14px; font-family: var(--font-code); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.device iframe { display: block; width: 100%; height: 340px; border: 0; background: #FFFFFF; }
.device .tip { color: #CFE6E6; font-size: 14px; padding: 10px 8px 4px; }
.device .tip b { color: var(--sun); }

/* ---------- plenary ---------- */
.qprog { display: flex; gap: 6px; }
.qprog i { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
.qprog i.ok { background: var(--t4); } .qprog i.no { background: var(--t2); } .qprog i.cur { background: var(--sun); }
textarea { font: inherit; font-size: 16px; width: 100%; min-height: 80px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; background: var(--paper); color: var(--ink); }

/* ---------- results ---------- */
.result { background: linear-gradient(160deg, var(--night), var(--dusk)); color: #FFFFFF; border-radius: 26px; padding: 28px 26px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.result .ring { width: 104px; height: 104px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; box-shadow: 0 0 0 9px rgba(245,166,35,.25); color: var(--night); font-family: var(--font-display); font-weight: 800; font-size: 34px; }
.result h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 5vw, 46px); margin: 0; line-height: 1; }
.result p { margin: 0; color: #CFE6E6; }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.breakdown div { background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px 14px; }
.breakdown small { display: block; color: #9FC3C6; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.breakdown b { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.breakdown span { color: #9FC3C6; }
@media (max-width: 520px) { .breakdown { grid-template-columns: minmax(0, 1fr); } }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.12); }
.sync i { width: 10px; height: 10px; border-radius: 50%; background: var(--sun); display: block; }
.sync.ok i { background: #62C554; } .sync.off i { background: #9FC3C6; }
table.board { width: 100%; border-collapse: collapse; font-size: 15px; }
table.board th, table.board td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.board th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
table.board td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
table.board tr.me td { background: var(--t3-soft); }
.levels-key { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.levels-key div { border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.levels-key div.me { border-color: var(--sun); background: var(--t3-soft); }
.levels-key b { display: block; }
@media (max-width: 640px) { .levels-key { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--t2-soft); border: 2px solid var(--t2); border-radius: 16px; padding: 12px 16px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 12px 20px; border-radius: 999px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 40; }
.toast b { color: var(--sun); }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .pop { animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: .6; } to { transform: none; opacity: 1; } }
  .fly { animation: fly 1s ease-out forwards; }
  @keyframes fly { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
  .btn.primary.ready { animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { box-shadow: 0 4px 0 rgba(16,34,41,.25), 0 0 0 0 var(--tc-soft); } 50% { box-shadow: 0 4px 0 rgba(16,34,41,.25), 0 0 0 8px var(--tc-soft); } }
}
@media (prefers-reduced-motion: reduce) { .fly { display: none; } }

    };
    sync();
    if (st.bDone) done();
  }

  function renderStarter() {
    theme(0);
    var st = S.starter;
    if (st.phase === "blank") { renderBlank(); return; }
    var head = '<div class="stage-head pop"><span class="big">1</span><div><div class="lbl">Starter · up to 60 points</div><h2>' +
      (st.phase === "watch" ? "Watch a table being built" : "Tag Hunt") + '</h2><p>' +
      (st.phase === "watch" ? "See which tag makes each part of a table. Then play the Tag Hunt." : "Click the right part of the table. 10 points for a first try, 5 for a second try.") + "</p></div></div>";
    app.innerHTML = head +
      '<div class="demo-stage"><div class="card"><div id="huntQ"></div>' + demoTable() + '<div id="huntMsg"></div></div>' +
      '<div class="col" style="display:grid;gap:14px;min-width:0"><div class="card"><h3>What each tag does</h3><div class="legend" id="legend">' +
      LEG.map(function (l) { return '<div data-leg="' + l[0] + '" style="--c:var(' + l[1] + ');--cs:var(' + l[2] + ')"><code>&lt;' + l[0] + '&gt;</code><span>' + l[3] + "</span></div>"; }).join("") +
      '</div><p class="note" id="demoSay"></p></div>' +
      '<div class="codebox"><div class="cbar"><span>The code behind it</span><span><i>yellow</i> = this step</span></div><pre id="demoCode">' +
      DEMO_CODE.map(function (l, i) { return '<span class="ln" data-ln="' + i + '">' + esc(l) + "</span>"; }).join("") + "</pre></div></div></div>" +
      '<div class="actions" id="starterActions"></div>';
    requestAnimationFrame(function () {
      placeRowTabs();
      if (st.phase === "watch") playDemo(); else { showAll(); startHunt(); }
    });
  }

  function clearDemo() { demoTimer.forEach(clearTimeout); demoTimer = []; }
  function showAll() {
    $("frame").classList.add("show"); $("chipTable").classList.remove("hide");
    document.querySelectorAll("#legend div").forEach(function (d) { d.classList.add("lit"); });
  }
  function playDemo() {
    clearDemo();
    var frame = $("frame"), cap = $("dCap");
    var ths = frame.querySelectorAll("th"), tds = frame.querySelectorAll("td"), tabs = frame.querySelectorAll(".rowtab");
    frame.classList.remove("show"); $("chipTable").classList.add("hide");
    [cap].concat([].slice.call(ths), [].slice.call(tds), [].slice.call(tabs)).forEach(function (e) { e.classList.add("hide"); e.classList.remove("glow-cap", "glow-th", "glow-td"); });
    frame.querySelectorAll("tr").forEach(function (tr) { tr.style.visibility = "hidden"; });
    document.querySelectorAll("#legend div").forEach(function (d) { d.classList.remove("lit"); });
    $("starterActions").innerHTML = '<button class="btn ghost" id="replay" type="button">Replay</button><button class="btn primary" id="toHunt" type="button" disabled>Start the Tag Hunt →</button>';
    $("replay").onclick = playDemo;
    $("toHunt").onclick = function () { clearDemo(); S.starter.phase = "hunt"; save(); renderStarter(); };
    var step = function (i) {
      var s = DEMO_STEPS[i];
      document.querySelectorAll("#demoCode .ln").forEach(function (l) { l.classList.toggle("lit", s.lines.indexOf(+l.dataset.ln) > -1); });
      var lg = document.querySelector('#legend [data-leg="' + s.tag + '"]'); lg.classList.add("lit");
      $("demoSay").innerHTML = s.say;
      if (s.tag === "table") { frame.classList.add("show"); $("chipTable").classList.remove("hide"); }
      if (s.tag === "caption") { cap.classList.remove("hide"); cap.classList.add("glow-cap"); }
      if (s.tag === "tr") { frame.querySelectorAll("tr").forEach(function (tr) { tr.style.visibility = "visible"; }); tabs.forEach(function (t) { t.classList.remove("hide"); }); cap.classList.remove("glow-cap"); }
      if (s.tag === "th") ths.forEach(function (c) { c.classList.remove("hide"); c.classList.add("glow-th"); });
      if (s.tag === "td") { ths.forEach(function (c) { c.classList.remove("glow-th"); }); tds.forEach(function (c) { c.classList.remove("hide"); c.classList.add("glow-td"); }); }
    };
    var gap = reduce ? 300 : 2200;
    DEMO_STEPS.forEach(function (_, i) { demoTimer.push(setTimeout(function () { step(i); }, 400 + i * gap)); });
    demoTimer.push(setTimeout(function () {
      tds.forEach(function (c) { c.classList.remove("glow-td"); });
      document.querySelectorAll("#demoCode .ln").forEach(function (l) { l.classList.remove("lit"); });
      $("demoSay").innerHTML = "That is a whole table: <code>&lt;table&gt;</code> → <code>&lt;tr&gt;</code> → <code>&lt;th&gt;</code> / <code>&lt;td&gt;</code>. Ready to hunt?";
      var b = $("toHunt"); b.disabled = false; b.classList.add("ready");
    }, 400 + DEMO_STEPS.length * gap));
  }

  function startHunt() {
    var st = S.starter;
    if (st.idx >= HUNT.length) { finishStarter(); return; }
    var h = HUNT[st.idx];
    $("huntQ").innerHTML = '<div class="challenge pop"><span class="n">' + (st.idx + 1) + " / " + HUNT.length + '</span><span class="q">' + h.q + "</span></div>";
    $("demoSay").textContent = "";
    var frame = $("frame");
    frame.classList.add("target");
    frame.querySelectorAll("[data-part]").forEach(function (el) { el.classList.add("hunt-target"); });
    frame.onclick = function (e) {
      var el = e.target.closest("[data-part]"); if (!el) return;
      var part = el.dataset.part;
      if (part === h.part) {
        var pts = st.tries === 0 ? 10 : st.tries === 1 ? 5 : 0;
        st.score += pts; st.idx++; st.tries = 0; save();
        el.classList.remove("flash-good"); void el.offsetWidth; el.classList.add("flash-good");
        $("huntMsg").innerHTML = '<div class="msg good">Correct! ' + esc(h.why) + "</div>";
        award(pts, pts ? "Correct!" : "");
        frame.onclick = null;
        setTimeout(startHunt, reduce ? 300 : 1100);
      } else {
        st.tries++; save();
        el.classList.remove("flash-bad"); void el.offsetWidth; el.classList.add("flash-bad");
        if (st.tries >= 2) {
          $("huntMsg").innerHTML = '<div class="msg info">Not quite. ' + esc(h.why) + " Click it to continue.</div>";
          var lg = document.querySelector('#legend [data-leg="' + h.part + '"]'); if (lg) { lg.classList.remove("flash-good"); void lg.offsetWidth; lg.classList.add("flash-good"); }
        } else {
          $("huntMsg").innerHTML = '<div class="msg bad">That is a <code>&lt;' + part + '&gt;</code>. Try again for 5 points!</div>';
        }
      }
    };
    $("starterActions").innerHTML = '<button class="btn ghost" id="rewatch" type="button">Watch the demo again</button>';
    $("rewatch").onclick = function () { frame.onclick = null; S.starter.phase = "watch"; save(); renderStarter(); };
  }
  function finishStarter() {
    $("frame").onclick = null;
    $("huntQ").innerHTML = '<div class="challenge pop"><span class="q">Starter complete! You scored ' + S.starter.score + " / 60.</span></div>";
    $("huntMsg").innerHTML = "";
    $("starterActions").innerHTML = '<button class="btn primary ready" id="toMain" type="button">Go to the Main Activity →</button>';
    $("toMain").onclick = function () { go("main"); sendToSheet(); };
  }

  /* ================= main ================= */
  function codeFor(n) {
    var L = [];
    L.push([n >= 3 ? '<table border="1" cellpadding="8">' : '<table border="1">', n === 0 || n === 3 ? "new" : "old"]);
    L.push(["  <caption>Emirates of the UAE</caption>", n === 0 ? "new" : "old"]);
    if (n >= 1) {
      L.push([n >= 3 ? '  <tr bgcolor="lightgreen">' : "  <tr>", n === 1 || n === 3 ? "new" : "old"]);
      L.push(["    <th>Emirate</th>", n === 1 ? "new" : "old"]); L.push(["    <th>Famous Landmark</th>", n === 1 ? "new" : "old"]); L.push(["  </tr>", n === 1 ? "new" : "old"]);
    }
    if (n >= 2) DATA.forEach(function (d) { var k = n === 2 ? "new" : "old"; L.push(["  <tr>", k]); L.push(["    <td>" + d[0] + "</td>", k]); L.push(["    <td>" + d[1] + "</td>", k]); L.push(["  </tr>", k]); });
    L.push(["</table>", n === 0 ? "new" : "old"]);
    return L;
  }
  function renderMain() {
    var m = S.main, i = m.task, t = TASKS[i];
    theme(i);
    var lines = codeFor(i).map(function (l) { return '<span class="' + l[1] + '">' + esc(l[0]) + "</span>"; }).join("\n");
    var levels = TASKS.map(function (tk, k) {
      var cls = k < i ? "ok" : k === i ? "cur" : "lock";
      return '<div class="' + cls + '" style="--c:var(' + TC[k][0] + ");--cs:var(" + TC[k][1] + ')"><span class="dot">' + (k < i ? "✓" : k + 1) + "</span>" + tk.name + "</div>";
    }).join("");
    app.innerHTML =
      '<div class="stage-head pop"><span class="big">2</span><div><div class="lbl">Main activity · Level ' + (i + 1) + ' of 4 · 25 points</div><h2>' + t.title + "</h2><p>Type your code in Notepad. This page shows what to do and what your page should look like.</p></div></div>" +
      '<div class="routine">' +
      '<div><span class="n" style="background:var(--t1)">1</span><span><b>Type in Notepad</b><span class="s">Open <code>UAE_Emirates_Table_Starter.html</code></span></span></div>' +
      '<div><span class="n" style="background:var(--t2)">2</span><span><b>Save</b><span class="s">Press <kbd>Ctrl</kbd> + <kbd>S</kbd></span></span></div>' +
      '<div><span class="n" style="background:var(--t4)">3</span><span><b>Refresh Chrome</b><span class="s">Press <kbd>F5</kbd> and compare</span></span></div></div>' +
      '<div class="levels">' + levels + "</div>" +
      '<div class="grid2"><div style="display:grid;gap:16px;min-width:0">' +
      '<div class="card task-body">' + t.body + '<details class="hint"><summary>Stuck? Show the code</summary><div class="codebox"><div class="cbar"><span>Notepad · your table so far</span><span><i>yellow</i> = type this now</span></div><pre>' + lines + "</pre></div></details></div>" +
      '<div class="card"><h3>Check your work <small style="color:var(--muted);font-family:var(--font-body);font-weight:400">(25 pts)</small></h3><div class="checklist" id="cl">' +
      t.checks.map(function (c, k) { var id = "c" + i + "_" + k; return '<label for="' + id + '"><input type="checkbox" id="' + id + '"' + (m.ticks[id] || m.checked[i] ? " checked" : "") + (m.checked[i] ? " disabled" : "") + "><span>" + c + "</span></label>"; }).join("") +
      '</div><div class="actions"><button class="btn primary" id="clBtn" type="button">My page matches ✓</button></div></div>' +
      '<div class="actions" id="mainActions"></div></div>' +
      '<div class="device"><div class="label"><span class="pill">LEVEL ' + (i + 1) + '</span>Your page should look like this</div><div class="screen"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">file:///Desktop/UAE_Emirates_Table_Starter.html</div></div><iframe id="pv" title="Expected output" sandbox=""></iframe></div><div class="tip"><b>Look for:</b> ' + esc(t.note) + "</div></div></div>";
    $("pv").srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:"Times New Roman",serif;margin:16px;color:#000;background:#fff}</style></head><body><h2 align="center">Emirates of the UAE</h2>' + codeFor(i).map(function (l) { return l[0]; }).join("\n") + "</body></html>";
    // checklist
    var boxes = document.querySelectorAll("#cl input");
    var upd = function () {
      var all = [].every.call(boxes, function (b) { return b.checked; });
      $("clBtn").disabled = !all || m.checked[i];
      $("clBtn").classList.toggle("ready", all && !m.checked[i]);
      $("clBtn").textContent = m.checked[i] ? "Level complete ✓ +25" : "My page matches ✓";
    };
    boxes.forEach(function (b) { b.addEventListener("change", function () { m.ticks[b.id] = b.checked; save(); upd(); }); });
    $("clBtn").onclick = function () { m.checked[i] = true; m.score[i] = 25; save(); boxes.forEach(function (b) { b.disabled = true; }); upd(); award(25, "Level " + (i + 1) + " complete!"); nextBtn(); };
    upd();
    if (m.checked[i]) nextBtn();
    function nextBtn() {
      $("mainActions").innerHTML = '<button class="btn primary ready" id="nextLv" type="button">' + (i === 3 ? "Finish – go to the Plenary →" : "Next level →") + "</button>";
      $("nextLv").onclick = function () {
        if (i === 3) { go("plenary"); sendToSheet(); return; }
        m.task = i + 1; save(); renderMain(); window.scrollTo(0, 0); sendToSheet();
      };
    }
  }
  /* ================= plenary ================= */
  function renderPlenary() {
    theme(3);
    var p = S.plenary;
    var prog = QUIZ.map(function (_, k) { return "<i class=\"" + (k < p.marks.length ? (p.marks[k] ? "ok" : "no") : k === p.idx ? "cur" : "") + "\"></i>"; }).join("");
    var head = '<div class="stage-head pop"><span class="big">3</span><div><div class="lbl">Plenary · up to 40 points</div><h2>Final Challenge</h2><p>Two questions, one try each – 20 points for each correct answer.</p></div></div>';
    if (p.idx < QUIZ.length) {
      var q = QUIZ[p.idx];
      app.innerHTML = head + '<div class="card"><div class="qprog">' + prog + '</div><p style="font-family:var(--font-display);font-weight:800;font-size:clamp(20px,3vw,26px);margin:16px 0 14px">' + (p.idx + 1) + ". " + esc(q.q) + '</p><div class="mcq" id="pq"></div><div id="pMsg"></div><div class="actions" id="pAct"></div></div>';
      var btns;
      $("pq").innerHTML = q.opts.map(function (o, k) { return '<button type="button" data-k="' + k + '"><span class="k">' + "ABCD"[k] + "</span><span>" + esc(o) + "</span></button>"; }).join("");
      btns = document.querySelectorAll("#pq button");
      btns.forEach(function (b) {
        b.onclick = function () {
          var k = +b.dataset.k, ok = k === q.a;
          btns.forEach(function (x) { x.disabled = true; if (+x.dataset.k === q.a) x.classList.add("right"); });
          if (!ok) b.classList.add("wrong");
          p.marks.push(ok); p.chosen = (p.chosen || []).concat(q.opts[k]); if (ok) p.score += QPTS; p.idx++; save();
          $("pMsg").innerHTML = ok ? '<div class="msg good">Correct!</div>' : '<div class="msg bad">The answer is ' + esc(q.opts[q.a]) + ".</div>";
          if (ok) award(QPTS, "Correct!"); else renderBar();
          $("pAct").innerHTML = '<button class="btn primary ready" id="pNext" type="button">' + (p.idx < QUIZ.length ? "Next question →" : "See my results →") + "</button>";
          $("pNext").onclick = function () { if (p.idx < QUIZ.length) renderPlenary(); else { p.done = true; go("done"); sendToSheet(); } };
        };
      });
    } else {
      app.innerHTML = head + '<div class="card"><div class="qprog">' + prog + '</div><h3 style="margin-top:16px">Plenary score: ' + p.score + ' / 40</h3><div class="actions"><button class="btn primary ready" id="finish" type="button">See my results →</button></div></div>';
      $("finish").onclick = function () { p.done = true; go("done"); sendToSheet(); };
    }
  }

  /* ================= results ================= */
  function renderDone() {
    theme(2);
    var sc = scores(), lv = levelFor(sc.total);
    app.innerHTML =
      '<section class="result pop"><div class="ring">' + sc.total + '</div><div class="eyebrow">Quest complete · Class ' + esc(S.cls) + ' – ' + esc(S.division) + "</div><h2>" + esc(S.name) + ", you are a " + lv.name + "!</h2>" +
      "<p>You scored " + sc.total + " out of 200 points.</p>" +
      '<div class="breakdown"><div><small>Starter</small><b>' + sc.starter + "</b> <span>/ 60</span></div><div><small>Main</small><b>" + sc.main + "</b> <span>/ 100</span></div><div><small>Plenary</small><b>" + sc.plenary + "</b> <span>/ 40</span></div></div>" +
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="sync" id="syncState"></span><button class="btn ghost" id="retryBtn" type="button" style="color:#FFFFFF;border-color:rgba(255,255,255,.4)" hidden>Save again</button></div></section>' +
      '<div class="card"><h3>Levels</h3><div class="levels-key">' + LEVELS.map(function (l, k) { var hi = LEVELS[k + 1] ? LEVELS[k + 1].min - 1 : 200; return '<div class="' + (l === lv ? "me" : "") + '"><b>' + l.name + "</b>" + l.min + "–" + hi + " points</div>"; }).join("") + "</div></div>" +
      '<div class="card" id="boardCard" hidden><h3>Class leaderboard · ' + esc(S.cls) + ' – ' + esc(S.division) + '</h3><div style="overflow-x:auto"><table class="board" id="board"></table></div><p class="note">Updates when classmates finish. Press Refresh to check.</p><div class="actions"><button class="btn ghost" id="refreshBoard" type="button">Refresh</button></div></div>' +
      '<div class="card"><h3>Finished early?</h3><p style="margin:0">Swap computers with a partner and compare their Notepad table with yours. Help them find any missing closing tags. Then try Activity Sheet 3.</p>' +
      '<div class="actions"><button class="btn ghost" id="newPlayer" type="button">Next student – start a new quest</button></div>' +
      '<div class="confirm" id="confirmBox" hidden style="margin-top:12px"><span>This clears ' + esc(S.name) + "'s game on this computer. Their scores stay in the spreadsheet.</span><button class=\"btn\" id=\"yes\" type=\"button\">Yes, new student</button><button class=\"btn ghost\" id=\"no\" type=\"button\">Cancel</button></div></div>";
    renderSync();
    $("retryBtn").onclick = sendToSheet;
    $("newPlayer").onclick = function () { $("confirmBox").hidden = false; };
    $("no").onclick = function () { $("confirmBox").hidden = true; };
    $("yes").onclick = function () { S = fresh(); save(); render(); };
    $("refreshBoard").onclick = loadBoard;
    if (SHEET) { $("boardCard").hidden = false; setTimeout(loadBoard, 2500); }
    confetti();
  }
  function loadBoard() {
    var t = $("board"); if (!t) return;
    t.innerHTML = "<tr><td>Loading…</td></tr>";
    fetch(SHEET + (SHEET.indexOf("?") > -1 ? "&" : "?") + "action=board&cls=" + encodeURIComponent(S.cls) + "&division=" + encodeURIComponent(S.division))
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (!rows || !rows.length) { t.innerHTML = "<tr><td>No scores yet.</td></tr>"; return; }
        t.innerHTML = "<tr><th>#</th><th>Name</th><th style=\"text-align:right\">Points</th></tr>" + rows.slice(0, 10).map(function (r, k) {
          var me = r.name === S.name;
          return '<tr class="' + (me ? "me" : "") + '"><td>' + (k + 1) + "</td><td>" + esc(r.name) + '</td><td class="num">' + r.total + "</td></tr>";
        }).join("");
      })
      .catch(function () { t.innerHTML = "<tr><td>The leaderboard could not load. Check the internet connection.</td></tr>"; });
  }
  function confetti() {
    if (reduce) return;
    var c = $("confetti"), ctx = c.getContext("2d"); c.hidden = false;
    var W = c.width = innerWidth, H = c.height = innerHeight, cols = ["#138A9E", "#E2574C", "#D98A0B", "#1E9A5F", "#F5A623"];
    var P = Array.from({ length: 150 }, function () { return { x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3.5, r: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - .5) * .3, col: cols[(Math.random() * 5) | 0] }; });
    var t0 = performance.now();
    (function f(now) {
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); });
      if (now - t0 < 3200) requestAnimationFrame(f); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
    })(t0);
  }

  window.addEventListener("resize", function () { if (S.stage === "starter") placeRowTabs(); });
  render();
})();
</script>
</body>
</html>
